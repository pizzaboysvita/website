<app-header></app-header>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<section class="change-section">
  <div class="form-container">
    <h2><i class="fa-solid fa-user-shield"></i> Change Password</h2>

    <form>
      <div class="input-group">
        <label for="name"><i class="fa-solid fa-user"></i> Edit Name</label>
        <input type="text" id="name" placeholder="Enter your name">
      </div>

      <div class="input-group">
        <label for="new-password"><i class="fa-solid fa-lock"></i> New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password">
      </div>

      <div class="input-group">
        <label for="confirm-password"><i class="fa-solid fa-lock"></i> Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm new password">
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-save"></i> Save Changes
      </button>
    </form>
  </div>
</section>



<app-footer></app-footer>
