<header class="header">
  <div class="container">
    <nav class="navbar navbar-expand-lg">

      <!-- Mobile Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSkeleton"
        aria-controls="offcanvasSkeleton">
        <span class="navbar-toggler-icon"><i class="ri-menu-line"></i></span>
      </button>

      <!-- Logo -->
      <a routerLink="/home" class="navbar-brand">
        <img class="img-fluid logo" src="assets/img/logo151025.jpg" alt="logo" />
      </a>

      <!-- Offcanvas -->
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasSkeleton"
        aria-labelledby="offcanvasSkeletonLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasSkeletonLabel">Pizza<span class="text-danger">Boyz</span></h5>
          <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-center flex-grow-1">
            <li class="nav-item" *ngFor="let link of navLinks">
              <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }" data-bs-dismiss="offcanvas">
                {{ link.label }}
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Store Name -->
      <div class="d-flex align-items-center me-3">
        <div class="store-name" (click)="changeStore()" title="{{ selectedStoreName }}">
          <i class="ri-store-line me-1"></i>{{ selectedStoreName }}
        </div>
      </div>

      <!-- Right Side -->
      <div class="nav-option order-md-2 d-flex align-items-center">

        <!-- Wishlist -->
        <div class="icon-button" (click)="goToWishList()">
          <i class="ri-heart-line"></i>
        </div>

        <!-- Cart -->
        <div class="icon-button position-relative" (click)="goToCart()">
          <i class="ri-shopping-cart-line"></i>
          <span *ngIf="cartCount > 0" class="cart-count">{{ cartCount }}</span>
        </div>

        <!-- Logged in (User / Guest) -->
        <div *ngIf="token || isGuestUser" class="profile-part dropdown">
          <img class="profile-pic" [src]="user?.profiles || 'assets/img/default-user.jpg'" alt="profile" />
          <div class="profile-info dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <h6 *ngIf="user">Hi, {{ user?.first_name }}</h6>
            <span *ngIf="isGuestUser">Guest Mode</span>
            <span *ngIf="!isGuestUser && user">My Account</span>
          </div>
          <ul class="dropdown-menu dropdown-menu-end">
            <li *ngIf="!isGuestUser">
              <a class="dropdown-item" routerLink="/myorders">My Orders</a>
            </li>
            <li *ngIf="!isGuestUser">
              <a class="dropdown-item" routerLink="/profile">Change Password</a>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <a class="dropdown-item text-danger" (click)="logout()">
                {{ isGuestUser ? "Exit Guest Mode" : "Logout" }}
              </a>
            </li>
          </ul>
        </div>

        <!-- Login -->
        <a *ngIf="!token && !isGuestUser" class="nav-link ms-auto btn btn-theme-outline"
          (click)="loginGuestModal.open()" data-bs-dismiss="offcanvas">Login / Guest</a>
      </div>
    </nav>
  </div>

  <!-- Guest/Login Modal -->
  <app-login-guest-modal (guestSelected)="onGuestSelected()" #loginGuestModal></app-login-guest-modal>

</header>
