<app-header></app-header>
<app-breadcrumb></app-breadcrumb>
<div class="container-fluid mt-4">
    <div class="row g-3">
        <div class="col-sm-6 position-relative">
            <div id="map"></div>
        </div>
        <div class="col-sm-6">
            <div class="mb-3">
                <input id="search-input" type="text" class="form-control shadow-sm"
                    placeholder="🔍 Search by Store Name, Street or City">
            </div>
            <div class="location-list">
                <div *ngFor="let store of locations" class="location-card card shadow-sm border-0 p-3 mb-3"
                    (click)="goToLocation(store.lat, store.lng, store)">
                    <div class="d-flex align-items-start">
                        <div class="flex-grow-1">
                            <h5 class="mb-1 fw-bold">{{ store.name }}</h5>
                            <p class="text-muted mb-1">📍 {{ store.address }}</p>
                        </div>
                    </div>
                    <div *ngIf="store.showHours" class="mt-3">
                        <button class="btn btn-danger btn-sm rounded-pill px-3 mb-2" (click)="markStoreOnMap(store)">
                            Future Order
                        </button>
                        <ul class="list-group small">
                            <li *ngFor="let day of store.hours"
                                class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>{{ day.day }}</strong>
                                <span>{{ day.from }} - {{ day.to }}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
