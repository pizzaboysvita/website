<div class="popular-restaurant banner-section section-b-space ratio3_2 overflow-hidden">
  <div class="container">
    <div class="title animated-title">
      <div class="d-flex align-items-center justify-content-between flex-wrap w-100">
        <div>
          <h2 class="text-white">Popular Picks</h2>
        </div>
      </div>
    </div>

    <div class="row g-md-4 g-3">
      @for (item of dishes; track item) {
      <div class="col-xl-3 col-lg-4 col-md-6">
        <div class="vertical-product-box product-style-3">
          <!-- Dish Image -->
          <div class="vertical-product-box-img">
            <img class="product-img-top w-100 bg-img" [src]="item.dish_image" [alt]="item.name" />
          </div>

          <!-- Dish Name & Price -->
          <div class="vertical-product-body">
            <h4 class="vertical-product-title text-white">
              {{ item.dish_name }}
            </h4>
            <h5 class="vertical-product-title text-white">
              $ {{ item.dish_price }}
            </h5>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</div>
