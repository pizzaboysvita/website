<app-breadcrumb></app-breadcrumb>

<div class="sectionbg">
  <div class="container mt-4">
    <h2 class="wishlist-title mb-4">
      <i class="ri-heart-3-fill text-danger"></i> My Wishlist
    </h2>

    <div class="wishlist-grid" *ngIf="wishlist.length > 0; else noData">
      <div class="wishlist-card" *ngFor="let item of wishlist">
        <div class="wishlist-img">
          <img
            [src]="item.dish_image || 'assets/img/default.jpg'"
            alt="{{ item.dish_name }}"
            class="dishimg"
            (error)="onImageError($event)"
          />
          <button class="close-icon" (click)="deleteItem(item)">
            <i class="ri-close-line"></i>
          </button>
        </div>

        <div class="wishlist-content">
          <h4 class="dish-name text-truncate">{{ item.dish_name }}</h4>
          <div class="wishlist-meta">
            <span class="price">₹{{ item.dish_price }}</span>
            <span class="store"><i class="ri-store-2-line"></i> {{ item.store_name }}</span>
          </div>

          <div class="wishlist-actions">
            <button
                class="cart-btn"
                [ngClass]="{ added: item.addedToCart }"
                (click)="addToCart(item)"
                >
                <ng-container *ngIf="!item.addedToCart; else added">
                    <i class="ri-shopping-cart-2-line"></i> Add to Cart
                </ng-container>
                <ng-template #added>
                    <i class="ri-check-double-line"></i> Added
                </ng-template>
            </button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #noData>
      <div class="empty-state text-center">
        <img src="assets/img/empty-heart.svg" alt="Empty Wishlist" class="empty-icon" />
        <p class="no-data-text mt-3">Your wishlist is empty!</p>
      </div>
    </ng-template>
  </div>
</div>
