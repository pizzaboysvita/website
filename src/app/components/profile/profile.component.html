<section class="change-section">
    <div class="form-container">
        <h2><i class="fa-solid fa-user-shield"></i> Change Password / Edit Profile</h2>

        <form [formGroup]="profileForm" (ngSubmit)="saveChanges()">
            <div class="input-group">
                <label for="name"><i class="fa-solid fa-user"></i> Edit Name</label>
                <input type="text" id="name" placeholder="Enter your name" formControlName="name">
            </div>

            <div class="input-group">
                <label for="new-password"><i class="fa-solid fa-lock"></i> New Password</label>
                <input type="password" id="new-password" placeholder="Enter new password" formControlName="newPassword">
            </div>

            <div class="input-group">
                <label for="confirm-password"><i class="fa-solid fa-lock"></i> Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm new password"
                    formControlName="confirmPassword">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-save"></i> Save Changes
            </button>
        </form>
    </div>
</section>
