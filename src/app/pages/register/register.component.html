<div class="signup-container">
    <div class="signup-card">
        <div class="logo">🍕 Pizza Boyz</div>
        <p class="subtitle">Join Pizza Boyz and start ordering!</p>

        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <!-- First Name -->
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input id="firstName" type="text" formControlName="first_name" placeholder="Enter your first name" />
                <small class="error"
                    *ngIf="signupForm.get('first_name')?.touched && signupForm.get('first_name')?.invalid">
                    First name is required (min 2 characters).
                </small>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input id="lastName" type="text" formControlName="last_name" placeholder="Enter your last name" />
                <small class="error"
                    *ngIf="signupForm.get('last_name')?.touched && signupForm.get('last_name')?.invalid">
                    Last name is required (min 2 characters).
                </small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
                <small class="error" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
                    Please enter a valid email.
                </small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password_hash" placeholder="Create a password" />
                <small class="error"
                    *ngIf="signupForm.get('password_hash')?.touched && signupForm.get('password_hash')?.invalid">
                    Password must be at least 6 characters.
                </small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" formControlName="confirmPassword"
                    placeholder="Confirm your password" />
                <small class="error"
                    *ngIf="signupForm.hasError('mismatch') && signupForm.get('confirmPassword')?.touched">
                    Passwords do not match.
                </small>
            </div>

            <!-- Country / State / City / Address / Phone / Image -->
            <div class="form-group">
                <label for="country">Country</label>
                <input id="country" type="text" formControlName="country" placeholder="Enter your country" />
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input id="state" type="text" formControlName="state" placeholder="Enter your state" />
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input id="city" type="text" formControlName="city" placeholder="Enter your city" />
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" formControlName="address" placeholder="Enter your address"></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input id="phone" type="tel" formControlName="phone_number" placeholder="Enter your phone number" />
            </div>

            <div class="form-group">
                <label for="image">Upload Image</label>
                <input id="image" type="file" (change)="onFileSelected($event)" />
            </div>

            <button type="submit" class="btn-login">Sign Up</button>
        </form>

        <p class="switch-link">
            Already have an account? <a routerLink="/login" routerLinkActive="active">Login</a>
        </p>
    </div>
</div>
